p&gt;&lt;span class=\&quot;intro\&quot;&gt;National population estimates give the best available measure of the population, by age and sex, usually living in Aotearoa New Zealand.&lt;\/span&gt;&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;134790&quot;,&quot;Title&quot;:&quot;National population estimates: At 30 June 2026 \u2013 key facts 1&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Key facts&lt;\/h2&gt;\n&lt;p&gt;At 30 June 2026, provisional estimates show:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;the estimated resident population of Aotearoa New Zealand was 5,357,300&lt;\/li&gt;\n&lt;li&gt;there were 2,699,500 females and 2,657,800 males&lt;\/li&gt;\n&lt;li&gt;the median age of females and males was 39.3 and 37.8 years respectively.&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;Over the last year (ending June 2026), provisional estimates show:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;New Zealand\u2019s population grew by 36,400 (0.7 percent)&lt;\/li&gt;\n&lt;li&gt;estimated natural increase (births minus deaths) was 18,700 (52 percent of total growth)&lt;\/li&gt;\n&lt;li&gt;estimated natural increase was the lowest increase since the early 1940s, during World War II&lt;\/li&gt;\n&lt;li&gt;estimated net migration (migrant arrivals minus migrant departures) was 17,600 (48 percent of total growth).&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;Over the last quarter (three months ending June 2026), provisional estimates show:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;New Zealand\u2019s population grew by 5,400 (0.1 percent)&lt;\/li&gt;\n&lt;li&gt;estimated natural increase (births minus deaths) was 4,000&lt;\/li&gt;\n&lt;li&gt;estimated net migration (migrant arrivals minus migrant departures) was 1,500.&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;Note that the figures above are independently rounded, so they may not sum to the stated totals.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;134659&quot;,&quot;Title&q &lt;p&gt;5,321,000&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;109\&quot;&gt;\n&lt;p&gt;-900&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td width=\&quot;165\&quot;&gt;\n&lt;p&gt;31 March 2025&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;163\&quot;&gt;\n&lt;p&gt;5,317,800&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;163\&quot;&gt;\n&lt;p&gt;5,317,500&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;109\&quot;&gt;\n&lt;p&gt;-300&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td width=\&quot;165\&quot;&gt;\n&lt;p&gt;31 December 2024&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;163\&quot;&gt;\n&lt;p&gt;5,307,700&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;163\&quot;&gt;\n&lt;p&gt;5,307,700&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;109\&quot;&gt;\n&lt;p&gt;0&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td colspan=\&quot;4\&quot; width=\&quot;601\&quot;&gt;\n&lt;p&gt;1. Due to rounding, individual figures may not sum to stated totals.&lt;\/p&gt;\n&lt;p&gt;2. The difference between current population estimates and previously published population estimates. Negative values denote a current estimate lower than previously published.&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;\/tbody&gt;\n&lt;\/table&gt;\n&lt;p&gt;The estimated births and deaths occurring in each period, in this release, differ from statistics presented elsewhere that relate to births and deaths registered during a given period of time. Estimated births and deaths are provisional until finalised one quarter after initial publication to include delayed registrations of births and deaths.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;1543&quot;,&quot;Title&quot;:&quot;National population estimates \u2013 more data&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Access data in Infoshare&lt;\/h2&gt;&lt;p&gt;Use&amp;nbsp;&lt;a href=\&quot;http:\/\/www.stats.govt.nz\/infoshare\/\&quot;&gt;Infoshare&lt;\/a&gt;&amp;nbsp;to&amp;nbsp;view and download time-series data for annual and quarterly national population estimates by single-year of age, five-year age groups, and selected age groups.&lt;br&gt;&lt;br&gt;Subject category:&amp;nbsp;Population&amp;nbsp;&lt;br&gt;Group:&amp;nbsp;Population estimates \u2013 DPE&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;134803&quot;,&quot;Title&quot;:&quot;National population estimates: At 30 June 2026 \u2013 metadata&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Definitions and metadata&lt;\/h2&gt;\n&lt;p&gt;\u2018As at\u2019 population estimates indicate the population at a given point in time, and can be used as denominators for stock populations, such as population shares at a given date or population change between two dates.&lt;\/p&gt;\n&lt;p&gt;\u2018Mean year ended\u2019 population estimates indicate the average population over a year and can be used as denominators for rates of events occurring during the year, such as births, deaths, and migration. \u2018Mean quarter ended\u2019 population estimates similarly indicate the average population over a quarter.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;http:\/\/datainfoplus.stats.govt.nz\/Item\/nz.govt.stats\/4c9f3523-5386-4ce0-a8bd-993bb905f119#\/nz.govt.stats\/3f786390-7291-45c6-bcb6-25a4146639a5\/\&quot;&gt;National population estimates \u2013 DataInfo+&lt;\/a&gt; gives general methodology used to produce national population estimates, and related metadata.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;133962&quot;,&quot;Title&quot;:&quot;Infoshare is being replaced by Aotearoa Data Explorer&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Infoshare is being replaced by Aotearoa Data Explorer&lt;\/h2&gt;\n&lt;p&gt;&lt;a id=\&quot;menur
